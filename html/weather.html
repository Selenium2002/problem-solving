<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/weather.css">
    <link rel="icon" href="../assets/weather.png">
	<script src="../javascript/weather.js" defer></script>
    <title>Weather App</title>
</head>
<body>
    <div class="card">

        <div class="search">
            <input type="text" placeholder="Enter City Name" spellcheck="false">
            <button><img src="../assets/weather-app-img/images/search.png" alt="search-icon"></button>
        </div>
        <div class="error">
            <p>Invalid City Name</p>
        </div>
        <!--  °C °F   -->
        <div class="weather">
            <img src="../assets/weather-app-img/images/rain.png" alt="rain-icon" class="weather-icon">
            <h1 class="temp">14 <span>°C</span>|<span>°F</span></h1>
            <h2 class="city">Alexandria</h2>
            <div class="details">
                <div class="col">
                    <img src="../assets/weather-app-img/images/humidity.png" alt="humidity-icon">
                    <div>
                        <p class="humidity">86%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="../assets/weather-app-img/images/wind.png" alt="wind-icon">
                    <div>
                        <p class="wind">5 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="../javascript/weather.js">
    </script>
</body>

</html>
